# The published scripts are generated from src/ (tools/build.sh): check that
# they are up to date, that every script parses (the POSIX ones under dash
# and busybox ash too), and that shellcheck finds no errors.
name: scripts

on:
  push:
    paths: ["src/**", "tools/**", "*.sh", ".github/workflows/scripts.yml"]
  pull_request:
    paths: ["src/**", "tools/**", "*.sh", ".github/workflows/scripts.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: generated files match src/
        run: bash tools/build.sh --check
      - name: bash -n
        run: for f in *.sh src/*.sh src/lib/*.sh tools/*.sh; do bash -n "$f" || exit 1; done
      - name: POSIX scripts parse under dash and busybox ash
        run: |
          sudo apt-get install -y -qq dash busybox >/dev/null
          for f in snell-alpine.sh snell-docker.sh install.sh entrypoint.sh src/lib/common.sh src/lib/release.sh src/lib/netinfo.sh src/lib/firewall.sh; do
            dash -n "$f" && busybox ash -n "$f" || exit 1
          done
      - name: shellcheck (errors)
        run: shellcheck -S error *.sh
